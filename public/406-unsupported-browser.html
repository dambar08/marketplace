<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Browser not supported · Marketplace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f4; color: #1c1917; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100% - 3rem, 28rem); }
      .kicker { margin: 0; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: #78716c; }
      h1 { margin: 0.75rem 0 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 0.75rem 0 0; color: #57534e; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Marketplace</p>
      <h1>This browser is not supported.</h1>
      <p>Open Marketplace in a current version of Chrome, Firefox, Safari, or Edge.</p>
    </main>
  </body>
</html>
