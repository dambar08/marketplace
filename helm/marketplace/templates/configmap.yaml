apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "marketplace.fullname" . }}
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
data:
  RAILS_ENV: production
  RAILS_LOG_LEVEL: {{ .Values.rails.logLevel | quote }}
  RAILS_MAX_THREADS: {{ .Values.rails.maxThreads | quote }}
  WEB_CONCURRENCY: {{ .Values.rails.webConcurrency | quote }}
  SIDEKIQ_CONCURRENCY: {{ .Values.rails.sidekiqConcurrency | quote }}
  HTTP_PORT: "8080"
  DB_HOST: {{ include "marketplace.database.host" . | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_USERNAME: {{ .Values.database.username | quote }}
  REDIS_HOST: {{ include "marketplace.redis.host" . | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  {{- with .Values.database.sslmode }}
  PGSSLMODE: {{ . | quote }}
  {{- end }}
