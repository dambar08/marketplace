{{- if not .Values.rails.existingSecret }}
{{- include "marketplace.validate" . }}
{{- $secretName := include "marketplace.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.database.password }}
{{- if and (not $password) .Values.database.bundled }}
{{- if and $existing (index $existing.data "MARKETPLACE_DATABASE_PASSWORD") }}
{{- $password = index $existing.data "MARKETPLACE_DATABASE_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $databaseUrl := .Values.database.url }}
{{- if .Values.database.bundled }}
{{- $databaseUrl = printf "postgres://%s:%s@%s:%v/%s" .Values.database.username ($password | urlquery) (include "marketplace.database.host" .) .Values.database.port .Values.database.name }}
{{- else if not $databaseUrl }}
{{- if not $password }}
{{- fail "Set database.password or database.url when database.bundled is false" }}
{{- end }}
{{- $databaseUrl = printf "postgres://%s:%s@%s:%v/%s" .Values.database.username ($password | urlquery) (include "marketplace.database.host" .) .Values.database.port .Values.database.name }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAILS_MASTER_KEY: {{ required "rails.masterKey is required" .Values.rails.masterKey | quote }}
  {{- if $password }}
  MARKETPLACE_DATABASE_PASSWORD: {{ $password | quote }}
  {{- end }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  REDIS_URL: {{ include "marketplace.redis.url" . | quote }}
  {{- with .Values.rails.secretKeyBase }}
  SECRET_KEY_BASE: {{ . | quote }}
  {{- end }}
{{- else }}
{{- include "marketplace.validate" . }}
{{- end }}
