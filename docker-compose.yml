name: "marketplace"

services:
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: memcached -m 128
    networks:
      - marketplace

  redis:
    image: valkey/valkey:8
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - marketplace

  postgres:
    image: postgres:16.1
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_development"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marketplace

networks:
  marketplace:
    driver: bridge

volumes:
  redis-data:
  postgres-data:

